[package]
name = "xtxp-mobile"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The XTXP muppet for the Android app: a local-first session, its pending changes and remotes, and sync with a y-sweet-compatible host, exposed to Kotlin with UniFFI."

[lib]
crate-type = ["cdylib", "rlib"]
name = "xtxp_mobile"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]

[dependencies]
# Pinned to one xtxp-rs commit so the app and the CLI muppets agree on Xmesh.
xmesh = { git = "https://github.com/xtxp-link/xtxp-rs", rev = "5b6ad49b56143603fbb1206965ca204718ccb34e" }
xtxp-wire = { git = "https://github.com/xtxp-link/xtxp-rs", rev = "5b6ad49b56143603fbb1206965ca204718ccb34e" }
yrs = "0.28.0"
uniffi = "0.29"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
# Blocking WebSocket: sync runs on a WorkManager thread. webpki roots, because
# Android's system store isn't readable as files.
tungstenite = { version = "0.27", default-features = false, features = ["handshake", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
xtxp-wire = { git = "https://github.com/xtxp-link/xtxp-rs", rev = "5b6ad49b56143603fbb1206965ca204718ccb34e", features = ["fake-host"] }
tempfile = "3"
tungstenite = { version = "0.27", default-features = false, features = ["handshake"] }

[profile.release]
opt-level = "s"
lto = true
# Keep symbols: uniffi-bindgen reads its metadata from them.
strip = "debuginfo"
