name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - uses: gradle/actions/setup-gradle@v4

      - name: Rust tests (session, moves, sync against an in-process y-sweet)
        working-directory: rust
        run: cargo test

      - name: Kotlin tests (bindings and bar/drop logic, on the JVM)
        run: ./gradlew -p core test

      # cargo-ndk finds the runner's NDK through ANDROID_NDK_ROOT.
      - name: Build the APK
        run: ./gradlew :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: xtxp-debug-apk
          path: app/build/outputs/apk/debug/*.apk
